<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorHood - Multi-Tenant Retail SaaS Platform</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel Compiler for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        // Make React hooks global for external Babel modules
        window.useState = React.useState;
        window.useEffect = React.useEffect;
        window.useMemo = React.useMemo;
        window.useRef = React.useRef;
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen overflow-x-hidden font-sans">

    <div id="root">
        <!-- React App mounts here -->
        <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500 mx-auto mb-4"></div>
                <p class="text-slate-400">Loading VendorHood Platform...</p>
            </div>
        </div>
    </div>

    <!-- React Application Components & Modules -->
    <script type="text/babel" src="src/components/Icon.js"></script>
    <script type="text/babel" src="src/components/SpiceStorefront.js"></script>
    <script type="text/babel" src="src/components/SneakerStorefront.js"></script>
    <script type="text/babel" src="src/components/WelcomeLanding.js"></script>
    <script type="text/babel" src="src/components/PlatformAdmin.js"></script>
    <script type="text/babel" src="src/components/VendorPortal.js"></script>
    <script type="text/babel" src="src/components/CustomerStorefront.js"></script>
    <script type="text/babel" src="src/App.js"></script>

    <script type="text/babel">
        // Mount React application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
